[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huffman-lz77-compressor"
version = "0.1.0"
description = "A from-scratch general-purpose file compressor combining canonical Huffman coding with LZ77 sliding-window matching."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Arnav Chawla" }]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyflakes>=3.0"]

[project.scripts]
hzc = "huffman_lz77.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
